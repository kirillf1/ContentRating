<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContentRating.Web.UI</title>
    <base href="/" />
    
    <!-- MudBlazor стили и шрифты -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="ContentRating.Web.UI.styles.css" rel="stylesheet" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- HLS.js для поддержки HLS видео -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    
    <!-- MudBlazor скрипты -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/hls-player.js"></script>
    
    <!-- PWA Updater скрипт -->
    <script src="_content/Toolbelt.Blazor.PWA.Updater.Service/script.min.js"></script>
    
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
