events {}

http {
    include mime.types;
    types {
        application/wasm wasm;
    }

    server {
        listen  80;
       
       
        root /var/www/web/;
        index index.html index.htm index.nginx-debian.html;
        server_name localhost;
        
        location / {
            try_files $uri $uri/ /index.html =404;
        }
    }
}

